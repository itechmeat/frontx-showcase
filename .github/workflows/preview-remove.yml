name: Preview remove

# Removes the preview of a pull request, pr-<N>/, from the preview repository when the pull request closes, merged or not.
# Security: pull_request_target runs with this repository's workflow and secrets, so nothing of the pull request is checked out or executed; the only value taken from it is its number, checked as a positive integer and passed through env. Without the GitHub App (vars.AUTOMATION_APP_ID) the run ends green and says so.
on:
  pull_request_target:
    types: [ closed ]

permissions:
  contents: read

# One group per pull request, so no publish of another pull request can replace this run while it waits. Overlapping pushes of other runs are handled by the 3 pull --rebase attempts; a publish of the same pull request that overlaps this run is handled by its open-state check.
concurrency:
  group: preview-remove-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove:
    name: Remove
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ID: ${{ vars.AUTOMATION_APP_ID }}
      PREVIEW_REPOSITORY: ${{ vars.PREVIEW_REPOSITORY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
    - name: Check the configuration
      id: config
      run: |
        set -euo pipefail
        if [ -z "$APP_ID" ]; then
          echo "Preview publishing is not configured: AUTOMATION_APP_ID is not set" >> "$GITHUB_STEP_SUMMARY"
          echo "configured=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]{0,9}$'; then echo "::error::pull request number '$PR_NUMBER' is not a positive integer"; exit 1; fi
        repository="${PREVIEW_REPOSITORY:-constructorfabric/frontx-showcase-previews}"
        if ! printf '%s' "$repository" | grep -Eq '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'; then echo "::error::PREVIEW_REPOSITORY must be owner/name, not '$repository'"; exit 1; fi
        owner="${repository%%/*}"
        if [ "$owner" != "$REPOSITORY_OWNER" ]; then echo "::error::PREVIEW_REPOSITORY must belong to $REPOSITORY_OWNER, not $owner"; exit 1; fi
        {
          echo "configured=true"
          echo "repository=$repository"
          echo "owner=$owner"
          echo "name=${repository#*/}"
        } >> "$GITHUB_OUTPUT"

    - name: Create the app token
      if: steps.config.outputs.configured == 'true'
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: ${{ steps.config.outputs.owner }}
        repositories: ${{ steps.config.outputs.name }}

    - name: Remove pr-<N>/ from the preview repository
      if: steps.config.outputs.configured == 'true'
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        TARGET: ${{ steps.config.outputs.repository }}
      run: |
        set -euo pipefail
        auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth"
        git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
        git_auth clone --filter=blob:none --sparse --depth 50 "https://github.com/$TARGET.git" previews
        cd previews
        git sparse-checkout set "pr-$PR_NUMBER"
        git config user.name frontx-showcase-preview-bot
        git config user.email preview-bot@frontx-showcase.invalid
        branch="$(git symbolic-ref --short HEAD)"
        git rm -r -q --ignore-unmatch "pr-$PR_NUMBER"
        if git diff --cached --quiet; then echo "pr-$PR_NUMBER/ is not published; nothing to remove"; exit 0; fi
        git commit -q -m "Remove the preview of $REPOSITORY#$PR_NUMBER"
        for attempt in 1 2 3; do
          if git_auth push origin "HEAD:$branch"; then echo "removed pr-$PR_NUMBER/"; exit 0; fi
          echo "push attempt $attempt was refused; rebasing on $branch"
          git_auth pull --rebase origin "$branch"
        done
        echo "::error::could not push the removal of pr-$PR_NUMBER/ after 3 attempts"
        exit 1
