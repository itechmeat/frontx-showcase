name: Preview publish

# Publishes the artifact of a successful "Preview build" run of a pull request into the preview repository (vars.PREVIEW_REPOSITORY, constructorfabric/frontx-showcase-previews by default) as pr-<N>/, served by its GitHub Pages at https://<owner>.github.io/<name>/pr-<N>/, and keeps one comment on the pull request that names it.
# Security: this run never checks out code and executes nothing from the artifact; the artifact is files only. The build ran the pull request's own code, its indexing check included, so this run checks the artifact again with its own shell before it publishes anything: no page may be indexed, and every path is a regular file or a folder. The pull request number comes from preview-meta.json in the artifact (workflow_run.pull_requests is empty for a fork) and is checked as a positive integer, the head commit is checked against the run's. Every ${{ }} value reaches a script through env. The preview repository is written with a GitHub App installation token (vars.AUTOMATION_APP_ID, secrets.AUTOMATION_APP_PRIVATE_KEY); without the app the run ends green and says so.
on:
  workflow_run:
    workflows: [ "Preview build" ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  pull-requests: read

# One group per pull request, so a newer pending run replaces only an older pending publish of the same pull request. The number is read from the artifact later, so the key is the head repository and branch, which name one open pull request into main. Overlapping pushes of other runs are handled by the 3 pull --rebase attempts. A publish of a pull request already closed when the open-state check below runs is not published; one that closes in the seconds between that check and the push can leave a preview, which cleanup-previews in the preview repository removes after the retention period.
concurrency:
  group: preview-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ID: ${{ vars.AUTOMATION_APP_ID }}
      PREVIEW_REPOSITORY: ${{ vars.PREVIEW_REPOSITORY }}
      PREVIEW_RETENTION_DAYS: ${{ vars.PREVIEW_RETENTION_DAYS }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
    - name: Check the configuration
      id: config
      run: |
        set -euo pipefail
        if [ -z "$APP_ID" ]; then
          echo "Preview publishing is not configured: AUTOMATION_APP_ID is not set" >> "$GITHUB_STEP_SUMMARY"
          echo "configured=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        repository="${PREVIEW_REPOSITORY:-constructorfabric/frontx-showcase-previews}"
        if ! printf '%s' "$repository" | grep -Eq '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'; then echo "::error::PREVIEW_REPOSITORY must be owner/name, not '$repository'"; exit 1; fi
        owner="${repository%%/*}"
        name="${repository#*/}"
        # One installation token serves both repositories, so they share an owner.
        if [ "$owner" != "$REPOSITORY_OWNER" ]; then echo "::error::PREVIEW_REPOSITORY must belong to $REPOSITORY_OWNER, not $owner"; exit 1; fi
        retention="${PREVIEW_RETENTION_DAYS:-7}"
        if ! printf '%s' "$retention" | grep -Eq '^[1-9][0-9]*$'; then echo "::error::PREVIEW_RETENTION_DAYS must be a positive integer, not '$retention'"; exit 1; fi
        {
          echo "configured=true"
          echo "repository=$repository"
          echo "owner=$owner"
          echo "name=$name"
          echo "retention=$retention"
        } >> "$GITHUB_OUTPUT"

    - name: Download the preview artifact
      if: steps.config.outputs.configured == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: site-preview
        path: preview
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # The same rules as `node scripts/indexing-check.mjs unindexed` in "Preview build", checked again here: that build ran the pull request's code, which a pull request can change, so only this file's own shell decides. Nothing from the artifact or the pull request runs.
    # The size limit of "Preview build" is enforced here for the same reason: the preview repository's Pages site, 1 GB for every open preview, takes at most MAX_MB from one.
    - name: Check no page of the artifact may be indexed
      if: steps.config.outputs.configured == 'true'
      env:
        MAX_MB: 150
      run: |
        set -euo pipefail
        cd preview
        odd="$(find . ! -type f ! -type d)"
        if [ -n "$odd" ]; then echo "::error::the artifact holds paths that are not regular files or folders: $(printf '%s' "$odd" | tr '\n' ' ')"; exit 1; fi
        size="$(du -sm . | cut -f1)"
        if [ "$size" -gt "$MAX_MB" ]; then echo "::error::the artifact is $size MB, over the $MAX_MB MB a preview may take"; exit 1; fi
        failed=0
        fail() { echo "::error::$1"; failed=1; }
        if [ ! -f robots.txt ] || [ "$(cat robots.txt)" != "$(printf 'User-agent: *\nDisallow: /')" ]; then fail 'robots.txt is not "User-agent: *" and "Disallow: /"'; fi
        if [ -f sitemap.xml ] && grep -qi '<loc' sitemap.xml; then fail 'sitemap.xml lists an address'; fi
        if [ -e llms.txt ]; then fail 'llms.txt is published'; fi
        # The robots tags and the page map are parsed, not grepped, by this file's own script read from stdin: it imports only node: builtins, so nothing in the artifact is loaded or run. It does what scripts/indexing-check.mjs does on the build side, which this run cannot import, because it checks out nothing.
        if ! node --input-type=module - <<'NODE'; then failed=1; fi
        import fs from 'node:fs';
        import path from 'node:path';
        const findings = [];
        const fail = (message) => findings.push(message);
        // A value from the artifact is printed JSON-quoted, so it cannot start a workflow command on a line of its own.
        const show = (value) => JSON.stringify(String(value).slice(0, 200));
        const RAW_TEXT = new Set(['script', 'style', 'textarea', 'title', 'xmp', 'iframe', 'noembed', 'noframes', 'plaintext']);
        const INERT = new Set(['template', 'noscript']);
        // The start tags of a document as the HTML tokenizer reads them: comments, doctypes and the text of raw-text elements are no tags, a "<" inside an attribute value starts none, and a tag inside <template> or <noscript> is inert (neither head-sync nor a rendering crawler reads it). A raw-text element keeps its text.
        function startTags(html) {
          const tags = [];
          let inert = 0;
          let i = 0;
          while ((i = html.indexOf('<', i)) !== -1) {
            if (html.startsWith('<!--', i)) {
              if (html.startsWith('>', i + 4)) i += 5;
              else if (html.startsWith('->', i + 4)) i += 6;
              else { const close = html.indexOf('-->', i + 4); i = close === -1 ? html.length : close + 3; }
              continue;
            }
            if (html[i + 1] === '!' || html[i + 1] === '?') { const close = html.indexOf('>', i); i = close === -1 ? html.length : close + 1; continue; }
            const closing = html[i + 1] === '/';
            const nameRule = /[a-zA-Z][^\s/>]*/y;
            nameRule.lastIndex = i + (closing ? 2 : 1);
            const nameMatch = nameRule.exec(html);
            if (!nameMatch) { i += 1; continue; }
            const name = nameMatch[0].toLowerCase();
            const attrs = [];
            let j = nameRule.lastIndex;
            while (j < html.length && html[j] !== '>') {
              if (/[\s/]/.test(html[j])) { j += 1; continue; }
              const attrRule = /[^\s/>][^\s/>=]*/y;
              attrRule.lastIndex = j;
              const attrName = attrRule.exec(html)[0].toLowerCase();
              j = attrRule.lastIndex;
              while (/\s/.test(html[j] ?? '')) j += 1;
              let value = '';
              if (html[j] === '=') {
                j += 1;
                while (/\s/.test(html[j] ?? '')) j += 1;
                const quote = html[j];
                if (quote === '"' || quote === "'") {
                  const close = html.indexOf(quote, j + 1);
                  value = html.slice(j + 1, close === -1 ? html.length : close);
                  j = close === -1 ? html.length : close + 1;
                } else {
                  const valueRule = /[^\s>]*/y;
                  valueRule.lastIndex = j;
                  value = valueRule.exec(html)[0];
                  j = valueRule.lastIndex;
                }
              }
              attrs.push({ name: attrName, value });
            }
            i = j + 1;
            if (closing) { if (INERT.has(name)) inert = Math.max(0, inert - 1); continue; }
            const tag = { name, attrs, inert: inert > 0 };
            tags.push(tag);
            if (INERT.has(name)) inert += 1;
            if (RAW_TEXT.has(name)) {
              const endRule = new RegExp(`</${name}[\\s/>]`, 'ig');
              endRule.lastIndex = i;
              const end = name === 'plaintext' ? null : endRule.exec(html);
              tag.text = html.slice(i, end ? end.index : html.length);
              i = end ? end.index : html.length;
            }
          }
          return tags;
        }
        // An attribute's first value is the one a browser keeps; a robots name is recognized through numeric character references, and one with any other "&" is taken as robots, so it must say noindex too.
        const first = (tag, name) => tag.attrs.find((attr) => attr.name === name)?.value;
        const decode = (value) => value.replace(/&#(x[0-9a-f]+|[0-9]+);?/gi, (_, code) => String.fromCodePoint(Number(code[0].toLowerCase() === 'x' ? `0${code}` : code)));
        const isRobots = (tag) => tag.name === 'meta' && tag.attrs.some((attr) => attr.name === 'name' && /^robots$|&/.test(decode(attr.value).trim().toLowerCase()));
        const saysNoindex = (tag) => tag.attrs.some((attr) => attr.name === 'content') && tag.attrs.filter((attr) => attr.name === 'content').every((attr) => attr.value.split(',').map((token) => token.trim().toLowerCase()).includes('noindex'));
        function htmlFiles(dir) {
          return fs.readdirSync(dir, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name)).flatMap((entry) => {
            const file = path.join(dir, entry.name);
            if (entry.isDirectory()) return htmlFiles(file);
            return entry.isFile() && /\.html?$/i.test(entry.name) ? [file] : [];
          });
        }
        // Every HTML file has a robots tag a browser reads, and every robots tag it holds, inert or not, has the token noindex.
        for (const file of htmlFiles('.')) {
          const robots = startTags(fs.readFileSync(file, 'utf8')).filter(isRobots);
          if (!robots.some((tag) => !tag.inert)) fail(`${show(file)}: no robots tag`);
          for (const tag of robots) if (!saysNoindex(tag)) fail(`${show(file)}: robots is ${show(first(tag, 'content') ?? 'without content')}, not noindex`);
        }
        // The page map head-sync reads: the one element of index.html with the id site-meta-map, a script whose text is JSON. Every page of it, the home page, the fallback, every screen's pages and pattern routes, and any other entry that carries "indexable", is indexable: false.
        const index = fs.existsSync('index.html') ? startTags(fs.readFileSync('index.html', 'utf8')) : [];
        const holders = index.filter((tag) => !tag.inert && first(tag, 'id') === 'site-meta-map');
        let map;
        if (holders.length !== 1 || holders[0].name !== 'script') fail(`index.html carries ${holders.length} elements with the id site-meta-map, not one script`);
        else {
          try { map = JSON.parse(holders[0].text); } catch (error) { fail(`the page map of index.html is not JSON: ${show(error.message)}`); }
        }
        if (map !== undefined) {
          const pages = [];
          const seen = new Set();
          const add = (page, name) => {
            if (typeof page === 'object' && page !== null) { if (seen.has(page)) return; seen.add(page); }
            pages.push([page, name]);
          };
          const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);
          if (!isRecord(map)) fail('the page map of index.html is not an object');
          else {
            add(map.home, 'home');
            add(map.fallback, 'fallback');
            if (!isRecord(map.screens)) fail('the page map of index.html has no screens');
            else for (const [token, screen] of Object.entries(map.screens)) {
              if (!isRecord(screen?.pages)) fail(`page map: screen ${show(token)} has no pages`);
              else for (const [route, page] of Object.entries(screen.pages)) add(page, `${token} ${route}`);
              if (!Array.isArray(screen?.patterns)) fail(`page map: screen ${show(token)} has no patterns`);
              else screen.patterns.forEach((page, n) => add(page, `${token} pattern ${n}`));
            }
            const walk = (value, where) => {
              if (typeof value !== 'object' || value === null) return;
              if (!Array.isArray(value) && Object.hasOwn(value, 'indexable')) add(value, where);
              for (const [key, child] of Object.entries(value)) walk(child, `${where}.${key}`);
            };
            walk(map, 'map');
            for (const [page, name] of pages) if (page?.indexable !== false) fail(`page map: ${show(name)} is indexable`);
          }
        }
        for (const finding of findings) console.log(`::error::${finding}`);
        process.exit(findings.length > 0 ? 1 : 0);
        NODE
        if [ "$failed" -ne 0 ]; then exit 1; fi
        echo "no page of the artifact may be indexed"

    - name: Read the pull request
      if: steps.config.outputs.configured == 'true'
      id: pr
      run: |
        set -euo pipefail
        meta=preview/preview-meta.json
        if [ ! -f "$meta" ] || [ -L "$meta" ]; then echo "::error::the artifact has no preview-meta.json"; exit 1; fi
        number="$(jq -r '.pr_number | tostring' "$meta")"
        sha="$(jq -r '.head_sha | tostring' "$meta")"
        if ! printf '%s' "$number" | grep -Eq '^[1-9][0-9]{0,9}$'; then echo "::error::pr_number must be a positive integer, not '$number'"; exit 1; fi
        if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || [ "$sha" != "$RUN_HEAD_SHA" ]; then echo "::error::head_sha '$sha' is not the head commit of the build run ($RUN_HEAD_SHA)"; exit 1; fi
        rm "$meta"
        echo "number=$number" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    # A build that finishes after its pull request closed, or a publish run re-run by hand, would bring back the preview "Preview remove" took down. The pull request's head commit must also be the commit this run built: the number comes from the artifact, which the build could forge, and no other pull request's head is this run's commit, so a build cannot publish as another open pull request. A build overtaken by a newer push is not published either; the newer build publishes.
    - name: Check the pull request is open
      if: steps.config.outputs.configured == 'true'
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
      run: |
        set -euo pipefail
        pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | @tsv')"
        state="$(printf '%s' "$pull" | cut -f1)"
        head="$(printf '%s' "$pull" | cut -f2)"
        if [ "$state" != open ]; then
          echo "Pull request #$PR_NUMBER is closed; the preview is not published" >> "$GITHUB_STEP_SUMMARY"
          echo "open=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$head" != "$RUN_HEAD_SHA" ]; then
          echo "Pull request #$PR_NUMBER has moved past this build; the preview is not published" >> "$GITHUB_STEP_SUMMARY"
          echo "open=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "open=true" >> "$GITHUB_OUTPUT"

    - name: Create the app token
      if: steps.config.outputs.configured == 'true' && steps.state.outputs.open == 'true'
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: ${{ steps.config.outputs.owner }}
        repositories: ${{ steps.config.outputs.name }},${{ github.event.repository.name }}

    - name: Publish pr-<N>/ to the preview repository
      if: steps.config.outputs.configured == 'true' && steps.state.outputs.open == 'true'
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        TARGET: ${{ steps.config.outputs.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.sha }}
      run: |
        set -euo pipefail
        auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth"
        git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
        # Only pr-<N>/ and the top-level files are checked out: the other previews stay on the server.
        git_auth clone --filter=blob:none --sparse --depth 50 "https://github.com/$TARGET.git" previews
        cd previews
        git sparse-checkout set "pr-$PR_NUMBER"
        git config user.name frontx-showcase-preview-bot
        git config user.email preview-bot@frontx-showcase.invalid
        branch="$(git symbolic-ref --short HEAD)"
        rm -rf "pr-$PR_NUMBER"
        mkdir "pr-$PR_NUMBER"
        cp -R ../preview/. "pr-$PR_NUMBER/"
        # A symlink could point outside pr-<N>/, and Pages would serve what it points to; only regular files and folders are committed.
        odd="$(find "pr-$PR_NUMBER" ! -type f ! -type d)"
        if [ -n "$odd" ]; then echo "::error::the copied preview holds paths that are not regular files or folders: $(printf '%s' "$odd" | tr '\n' ' ')"; exit 1; fi
        git add -A "pr-$PR_NUMBER"
        if git diff --cached --quiet; then echo "pr-$PR_NUMBER/ is already this build"; exit 0; fi
        git commit -q -m "Preview of $REPOSITORY#$PR_NUMBER at $HEAD_SHA"
        for attempt in 1 2 3; do
          if git_auth push origin "HEAD:$branch"; then echo "published pr-$PR_NUMBER/"; exit 0; fi
          echo "push attempt $attempt was refused; rebasing on $branch"
          git_auth pull --rebase origin "$branch"
        done
        echo "::error::could not push pr-$PR_NUMBER/ after 3 attempts"
        exit 1

    # One comment per pull request, found by its hidden marker among the app's own comments and updated on every push. The REST API posts to the base repository's issue thread, which works for a pull request from a fork too.
    - name: Comment the preview address on the pull request
      if: steps.config.outputs.configured == 'true' && steps.state.outputs.open == 'true'
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.sha }}
        OWNER: ${{ steps.config.outputs.owner }}
        NAME: ${{ steps.config.outputs.name }}
        RETENTION: ${{ steps.config.outputs.retention }}
      run: |
        set -euo pipefail
        marker='<!-- frontx-showcase-preview -->'
        url="https://$OWNER.github.io/$NAME/pr-$PR_NUMBER/"
        body="$(printf '%s\n**Preview:** %s\n\nBuilt from %s. Pages may take a few minutes to serve a new build. The preview is not indexed; it is removed when this pull request closes, or after %s days without a new build.' "$marker" "$url" "$HEAD_SHA" "$RETENTION")"
        bot="${APP_SLUG}[bot]"
        existing="$(gh api --paginate "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.user.login == \"$bot\" and (.body | contains(\"$marker\"))) | .id" | sed -n 1p)"
        if [ -n "$existing" ]; then
          gh api --method PATCH "/repos/$REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          echo "updated comment $existing"
        else
          gh api --method POST "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          echo "posted a comment"
        fi
